name: Tests

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Godot installieren
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          rm godot.zip

      - name: Unit-Tests (GUT)
        run: GODOT="$RUNNER_TEMP/godot" ./run_tests.sh

      - name: Skalierung prüfen (1080p, 1440p, 4K, 1366x768)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick python3-pil libgl1-mesa-dri
          GODOT="$RUNNER_TEMP/godot" tools/check_scaling.sh

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results/
